version: '3.8'
services:
  postgres:
    image: ankane/pgvector:postgres-15
    environment:
      POSTGRES_DB: reqsync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
