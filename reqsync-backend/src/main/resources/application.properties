spring.application.name=reqsync-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reqsync_db
spring.datasource.username=postgres
spring.datasource.password=1234

gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimension=768

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.5-flash-lite
jwt.secret=ReqSyncJWTSecretKey2026ForAuthenticationSystemSecure
jwt.expiration=86400000
